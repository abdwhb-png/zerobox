name: Private runtime native validation

on:
  push:
    branches: ["codex/private-runtime-validation-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Prepare native runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          if uname -r | grep -Eiq 'microsoft|wsl'; then exit 1; fi
          sudo apt-get update
          sudo apt-get install -y bubblewrap libcap-dev
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          npm install --global --ignore-scripts --no-audit --no-fund sfw@2.0.6
          sfw --version
      - name: Replay patches and fetch locked inputs
        run: |
          ./scripts/sync.sh
          sfw cargo fetch --locked
      - name: Check owned code and test the complete Rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --offline --locked --no-deps -p zerobox --lib --bins -- -D warnings -A clippy::result_large_err
          cargo test --offline --locked --workspace --lib
      - name: Build static engine and helper
        run: cargo rustc --offline --locked --release -p zerobox --bin zerobox --target x86_64-unknown-linux-gnu -- -C target-feature=+crt-static
      - name: Exercise the native kernel boundary
        env:
          ZEROBOX_EXEC: ${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/zerobox
        # Legacy root-readable fixtures observe other tests' transient FUSE
        # mounts. Serialize fixtures while retaining their explicit concurrency tests.
        run: cargo test --offline --locked -p zerobox --test integration -- --test-threads=1
